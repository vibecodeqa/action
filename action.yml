name: 'VibeCode QA'
description: 'Code health scanner — PR comments, quality gates, SARIF, AI autofix'
author: 'VibeCode QA'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  fail-under:
    description: 'Minimum score (0-100). Fails the check if score is below this.'
    required: false
    default: '0'
  skip-tests:
    description: 'Skip test execution for faster scans.'
    required: false
    default: 'false'
  sarif:
    description: 'Upload SARIF to GitHub Code Scanning.'
    required: false
    default: 'true'
  pr-comment:
    description: 'Post score and issues as a PR comment.'
    required: false
    default: 'true'
  auto-fix:
    description: 'Open a fix PR with AI-powered fixes when score drops.'
    required: false
    default: 'false'
  checks:
    description: 'Comma-separated list of checks to run (empty = all).'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key for AI autofix (required if auto-fix is true).'
    required: false
    default: ''

outputs:
  score:
    description: 'The composite score (0-100).'
  grade:
    description: 'The grade (A/B/C/D/F).'
  issues:
    description: 'Total number of issues found.'
  report-path:
    description: 'Path to the generated report directory.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run VibeCode QA scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        VCQA_NO_UPDATE_CHECK: '1'
      run: |
        # Build CLI flags
        FLAGS="--json --sarif"

        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          FLAGS="$FLAGS --skip-tests"
        fi

        FAIL_UNDER="${{ inputs.fail-under }}"
        if [ "$FAIL_UNDER" != "0" ] && [ -n "$FAIL_UNDER" ]; then
          FLAGS="$FLAGS --fail-under $FAIL_UNDER"
        fi

        if [ "${{ inputs.pr-comment }}" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
          FLAGS="$FLAGS --pr-comment"
        fi

        # Run scan (don't fail yet — we need to parse output first)
        set +e
        OUTPUT=$(npx @vibecodeqa/cli@latest $FLAGS 2>&1)
        EXIT_CODE=$?
        set -e

        # Contract: JSON fields are defined by @vibecodeqa/schema.
        # This composite action only reads score, grade, and checks[].issues.
        SCORE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score',0))" 2>/dev/null || echo "0")
        GRADE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('grade','?'))" 2>/dev/null || echo "?")
        ISSUES=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(sum(len(c.get('issues',[])) for c in d.get('checks',[])))" 2>/dev/null || echo "0")

        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
        echo "report-path=.vibe-check" >> "$GITHUB_OUTPUT"

        echo "::notice::VibeCode QA: $GRADE $SCORE/100 ($ISSUES issues)"

        # Exit with scan exit code (respects --fail-under)
        if [ "$EXIT_CODE" -ne 0 ] && [ "$FAIL_UNDER" != "0" ]; then
          echo "::error::Score $SCORE is below minimum $FAIL_UNDER"
          exit 1
        fi

    - name: Upload SARIF
      if: inputs.sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: .vibe-check/report.sarif

    - name: AI Autofix
      if: inputs.auto-fix == 'true' && steps.scan.outputs.score != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          echo "::warning::auto-fix requires anthropic-api-key input"
          exit 0
        fi

        echo "Running AI autofix..."
        npx @vibecodeqa/cli@latest fix --ai 2>&1 || true

        # Check if any files were modified
        if git diff --quiet; then
          echo "No fixes applied."
          exit 0
        fi

        # Create fix commit on the PR branch
        git config user.name "vibecodeqa[bot]"
        git config user.email "bot@vibecodeqa.online"
        git add -A
        git commit -m "fix: apply VibeCode QA AI fixes

        Co-Authored-By: VibeCode QA <bot@vibecodeqa.online>"
        git push
        echo "::notice::AI fixes applied and pushed to PR branch"
