name: 'VibeCode QA'
description: 'Code health scanner — PR comments, quality gates, SARIF, AI autofix'
author: 'VibeCode QA'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  fail-under:
    description: >-
      Minimum score. A non-negative integer; the step fails when the score is below it.
      '0' passes no threshold to the CLI, so a failUnder in the project's .vcqa.json
      (or package.json "vcqa") still applies.
    required: false
    default: '0'
  skip-tests:
    description: "Skip test execution for faster scans. 'true' or 'false'."
    required: false
    default: 'false'
  sarif:
    description: "Upload SARIF to GitHub Code Scanning (needs security-events: write). 'true' or 'false'."
    required: false
    default: 'true'
  pr-comment:
    description: "Post score and issues as a PR comment on pull_request events (needs pull-requests: write). 'true' or 'false'."
    required: false
    default: 'true'
  auto-fix:
    description: "Push AI-generated fixes to the PR branch (needs contents: write and anthropic-api-key). 'true' or 'false'."
    required: false
    default: 'false'
  cli-version:
    description: >-
      npm semver spec of @vibecodeqa/cli to run. Defaults to the minor line this action
      release was tested against.
    required: false
    default: '^0.56.0'
  anthropic-api-key:
    description: 'Anthropic API key for AI autofix (required if auto-fix is true).'
    required: false
    default: ''

outputs:
  score:
    description: 'The composite score (0-100). Empty if the scan produced no report.'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'The grade (A/B/C/D/F). Empty if the scan produced no report.'
    value: ${{ steps.scan.outputs.grade }}
  issues:
    description: 'Total number of issues found. Empty if the scan produced no report.'
    value: ${{ steps.scan.outputs.issues }}
  report-path:
    description: 'Path to the generated report directory (.vibe-check).'
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    # Every input reaches a shell through env:, never through ${{ }} inside run:
    # (R-GHA-4), and is validated here before anything is downloaded or run.
    - name: Validate inputs
      shell: bash
      env:
        FAIL_UNDER: ${{ inputs.fail-under }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        SARIF: ${{ inputs.sarif }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        AUTO_FIX: ${{ inputs.auto-fix }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        bad=0
        if ! [[ "$FAIL_UNDER" =~ ^[0-9]{1,3}$ ]]; then
          echo "::error title=VibeCode QA invalid input::fail-under must be a non-negative integer, got '$FAIL_UNDER'"
          bad=1
        fi
        for pair in "skip-tests=$SKIP_TESTS" "sarif=$SARIF" "pr-comment=$PR_COMMENT" "auto-fix=$AUTO_FIX"; do
          name="${pair%%=*}"; value="${pair#*=}"
          if [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error title=VibeCode QA invalid input::$name must be 'true' or 'false', got '$value'"
            bad=1
          fi
        done
        # An npm semver range or dist-tag: no whitespace-led flags, no shell or path syntax.
        if ! [[ "$CLI_VERSION" =~ ^[0-9A-Za-z^~*\<\>=][0-9A-Za-z.^~*\<\>=|\ -]*$ ]]; then
          echo "::error title=VibeCode QA invalid input::cli-version must be an npm version, range or dist-tag, got '$CLI_VERSION'"
          bad=1
        fi
        exit "$bad"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Run VibeCode QA scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VCQA_NO_UPDATE_CHECK: '1'
        FAIL_UNDER: ${{ inputs.fail-under }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        args=(--json --sarif)
        if [ "$SKIP_TESTS" = "true" ]; then args+=(--skip-tests); fi
        if [ "$FAIL_UNDER" != "0" ]; then args+=(--fail-under "$FAIL_UNDER"); fi
        if [ "$PR_COMMENT" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then args+=(--pr-comment); fi

        # Results are read from .vibe-check/report.json, which the CLI always
        # writes. stdout (the same report, with --json) goes to a file; stderr,
        # including anything npm prints, stays visible in the log.
        tmp="${RUNNER_TEMP:-/tmp}"
        sentinel="$tmp/vcqa-scan-start"
        : > "$sentinel"
        set +e
        npx --yes "@vibecodeqa/cli@$CLI_VERSION" "${args[@]}" > "$tmp/vcqa-stdout.json"
        cli_exit=$?
        set -e

        VCQA_EXIT="$cli_exit" VCQA_SENTINEL="$sentinel" VCQA_FAIL_UNDER="$FAIL_UNDER" \
          node "$GITHUB_ACTION_PATH/scripts/summarise-report.mjs"

    - name: Upload SARIF
      if: always() && inputs.sarif == 'true' && hashFiles('.vibe-check/report.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      # Code scanning is unavailable on some private repositories; a failed upload
      # is shown on the step but does not fail the quality gate.
      continue-on-error: true
      with:
        sarif_file: .vibe-check/report.sarif

    - name: AI Autofix
      if: inputs.auto-fix == 'true' && steps.scan.outputs.score != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        VCQA_NO_UPDATE_CHECK: '1'
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          # Not an error: secrets are empty on pull requests from forks.
          echo "::warning::auto-fix requires the anthropic-api-key input; skipping."
          exit 0
        fi
        echo "::add-mask::$ANTHROPIC_API_KEY"

        echo "Running AI autofix..."
        npx --yes "@vibecodeqa/cli@$CLI_VERSION" fix --ai

        if git diff --quiet; then
          echo "No fixes applied."
          exit 0
        fi

        git config user.name "vibecodeqa[bot]"
        git config user.email "bot@vibecodeqa.online"
        git add -A
        git commit -m "fix: apply VibeCode QA AI fixes" -m "Co-Authored-By: VibeCode QA <bot@vibecodeqa.online>"
        git push
        echo "::notice::AI fixes applied and pushed to PR branch"
