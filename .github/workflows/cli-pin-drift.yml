# Watches the pinned scan engine for drift (vibecodeqa/action#3).
#
# The `cli-version` input in action.yml defaults to a caret on a 0.x version,
# which is a MINOR range: every @v1 user runs that minor line until the default
# is bumped and a release is cut. The pin is deliberate — an unpinned engine
# changes every consumer's results with no change in this repo (#1) — but it
# previously sat eleven minors behind because nothing was watching.
#
# Once a week, compare the published CLI against the pin and file an issue when
# it has moved on. It does not bump anything itself: a bump changes consumers'
# scores and ships only through a release (release.yml). Mirrors
# vibecodeqa/mcp .github/workflows/cli-pin-drift.yml.
name: CLI pin drift

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Compare published CLI against the pin
        id: drift
        run: |
          set -euo pipefail
          # Parsed with node rather than sed/grep: BSD and GNU sed regexes differ,
          # and the default sits a few lines below the `cli-version:` key.
          PINNED=$(node -e '
            const src = require("node:fs").readFileSync("action.yml", "utf8");
            const m = src.match(/\n  cli-version:\n(?:    .*\n)*?    default: .\^?([0-9]+\.[0-9]+\.[0-9]+)./);
            if (!m) { console.error("cli-version default not found in action.yml"); process.exit(1); }
            process.stdout.write(m[1]);
          ')
          LATEST=$(npm view @vibecodeqa/cli version)
          echo "pinned=$PINNED  latest=$LATEST"
          {
            echo "pinned=$PINNED"
            echo "latest=$LATEST"
            if [ "${PINNED%.*}" = "${LATEST%.*}" ]; then
              echo "drifted=false"
            else
              echo "drifted=true"
            fi
          } >> "$GITHUB_OUTPUT"

      # One open issue at a time, found by label and kept under a stable title.
      # Later drift (0.57.0, then 0.57.1, then 0.58.0) is a comment on that
      # issue, once per published version, not a new issue each Monday.
      - name: File or update the drift issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.drift.outputs.pinned }}
          LATEST: ${{ steps.drift.outputs.latest }}
        run: |
          set -euo pipefail
          TITLE="cli-version default is behind the published @vibecodeqa/cli"
          LINE="Published \`@vibecodeqa/cli@$LATEST\`; \`cli-version\` defaults to \`^$PINNED\`."
          gh label create cli-pin-drift --color ededed \
            --description "Pinned scan engine is behind the published CLI" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label cli-pin-drift --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            if gh issue view "$EXISTING" --json body,comments --jq '[.body, .comments[].body] | join("\n")' \
              | grep -qF "@vibecodeqa/cli@$LATEST\`"; then
              echo "Issue #$EXISTING already records $LATEST; nothing to do."
            else
              gh issue comment "$EXISTING" --body "$LINE"
            fi
            exit 0
          fi
          BODY=$(cat <<EOF
          $LINE

          A caret on a \`0.x\` version is a minor range, so \`@v1\` users will not pick
          this up on their own.

          To move the pin:

          1. Bump the \`cli-version\` default in \`action.yml\`, and \`CLI_VERSION_DEFAULT\`
             in its validation step, to the new minor. The self-test fails if they differ.
          2. Check the self-test workflow passes on the pull request.
          3. Note the score change in an "Upgrading" section of the README, and name
             that heading in the Release workflow's \`notes-section\` input so it
             opens the release notes.
          4. Cut a release with the Release workflow, which tags \`v1.x.y\` and moves \`v1\`.

          Filed automatically by \`.github/workflows/cli-pin-drift.yml\`. Later drift is
          added here as comments; close this issue when the pin is current.
          EOF
          )
          gh issue create --title "$TITLE" --label cli-pin-drift --body "$BODY"
